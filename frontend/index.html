
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div>
            <h2>TaskFlow</h2>
            <p>Plan your work. Track your progress.</p>
        </div>
        <span id="totalTasks">0 Tasks</span>
    </header>

    <main class="container">

        <h1>Task Management Dashboard</h1>
        <p class="subtitle">Organize your daily tasks in one place.</p>

        <div class="add-task">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task...">
            <button id="addButton">+ Add Task</button>
        </div>

        <div class="task-board">

            <section class="task-column">
                <div class="column-heading">
                    <h3>Pending</h3>
                    <span id="pendingCount">0</span>
                </div>
                <div id="pendingTasks" class="task-list"></div>
            </section>

            <section class="task-column">
                <div class="column-heading">
                    <h3>Ongoing</h3>
                    <span id="ongoingCount">0</span>
                </div>
                <div id="ongoingTasks" class="task-list"></div>
            </section>

            <section class="task-column">
                <div class="column-heading">
                    <h3>Completed</h3>
                    <span id="completedCount">0</span>
                </div>
                <div id="completedTasks" class="task-list"></div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
